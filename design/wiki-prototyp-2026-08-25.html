<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<title>Grim Reach · Wiki-Prototyp</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English&display=swap" rel="stylesheet">
<style>
:root{--gold:#d8c06a;--gold2:#f0d898;--ink:#e8d8b0;--muted:#a8946f;--line:rgba(154,128,96,.28);--green:#8fc07a;--red:#e04a35}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{color:var(--ink);font:16px/1.5 "IM Fell English",Georgia,serif;background:#0b0907 url("../apps/client/src/renderer/assets/ui/gravewood/textures/texture-leather.webp") repeat;background-size:280px 280px}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(18,13,9,.35),rgba(4,4,4,.62));pointer-events:none}
.app{position:relative;display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;max-width:1500px;margin:0 auto;padding:22px;min-height:100vh}
h1,h2,h3,.head{font-family:Cinzel,Georgia,serif;letter-spacing:.04em}
.side{display:flex;flex-direction:column;gap:14px}
.panel{border:11px solid transparent;border-image:url("../apps/client/src/renderer/assets/ui/gravewood/v3/frames/panel-frame.webp") 48 / 11px;background:#090b0c url("../apps/client/src/renderer/assets/ui/gravewood/v3/textures/texture-basalt.webp") repeat;background-size:192px 192px;padding:10px 14px}
.panel h3{margin:4px 0 10px;color:var(--gold);font-size:14px;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;min-width:160px;padding:7px 18px;border:8px solid transparent;border-image:url("../apps/client/src/renderer/assets/ui/gravewood/frames/nav-bronze-lipped-iron-9slice.webp") 85 fill / calc(8px * 2.125);background:#111315 url("../apps/client/src/renderer/assets/ui/gravewood/v3/textures/texture-basalt.webp") repeat;background-size:192px 192px;color:#ead8a0;font-family:Cinzel,Georgia,serif;font-size:15px;line-height:1.15;text-shadow:0 1px 2px #000;cursor:pointer;transition:filter .12s,color .12s}
.btn:hover{filter:brightness(1.12);color:#fff1bd}.btn[disabled]{filter:grayscale(.4) brightness(.75);color:#9a8c6a;cursor:not-allowed}
.btn.sm{min-height:38px;min-width:0;padding:4px 12px;font-size:13px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
input.search{width:100%;padding:10px 12px;background:#0f0c08;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:15px}
.results{max-height:260px;overflow:auto;margin:6px 0 0;padding:0;list-style:none}
.results li,.hist li{padding:5px 6px;cursor:pointer;border-bottom:1px solid rgba(154,128,96,.14);display:flex;gap:8px;align-items:center}
.results li:hover,.hist li:hover{background:rgba(216,192,106,.08)}
.hist{list-style:none;margin:0;padding:0;max-height:38vh;overflow:auto}.hist li.cur{color:var(--gold2)}
.mini{width:24px;height:24px;object-fit:contain;image-rendering:pixelated;flex:0 0 auto}
.page{display:flex;flex-direction:column;gap:16px}
.hero{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:start}
.hero img{width:150px;height:150px;object-fit:contain;image-rendering:pixelated;background:#0f0c08;border:2px solid var(--line)}
.hero h1{margin:0;color:var(--gold2);font-size:30px}
.sub{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:13px;margin:2px 0 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:rgba(10,8,6,.6);padding:4px 10px;font-size:13px}
.chip b{color:var(--gold)}
.desc{font-style:italic;color:#d8c8a0;margin:8px 0 0}
.sec{border-top:1px solid var(--line);padding-top:10px}
.sec h2{margin:0 0 8px;color:var(--gold);font-size:18px;display:flex;align-items:center;gap:10px}
.count{font:13px Cinzel,Georgia,serif;color:var(--muted);border:1px solid var(--line);padding:2px 8px}
.src{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{border:1px solid var(--line);background:rgba(10,8,6,.55);padding:10px 12px}
.card .t{font-family:Cinzel,Georgia,serif;color:var(--gold2);font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.card .t small{color:var(--muted);font-family:"IM Fell English",Georgia,serif;font-size:13px}
.ing{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
a.il,a.sl{color:var(--gold2);text-decoration:none;border-bottom:1px dotted rgba(216,192,106,.5);cursor:pointer;display:inline-flex;gap:5px;align-items:center}
a.il:hover,a.sl:hover{color:#fff1bd;border-bottom-color:var(--gold2)}
a.sl{color:#9fd0ff;border-bottom-color:rgba(159,208,255,.5)}
.qty{color:var(--muted)}
.chain{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.chain .node{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:rgba(10,8,6,.6);padding:6px 12px}
.chain .node.cur{border-color:var(--gold);box-shadow:0 0 8px rgba(216,192,106,.25)}
.chain .arrow{color:var(--muted);padding:2px 0 2px 26px;font-size:18px}
.chain .via{color:var(--muted);font-size:12px;margin-left:8px}
.fan{display:flex;flex-wrap:wrap;gap:8px}
.toast{position:fixed;right:22px;bottom:22px;background:#1a1410;border:1px solid var(--gold);padding:10px 16px;color:var(--gold2);font-family:Cinzel,Georgia,serif;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.muted{color:var(--muted)}
.usedgroup{margin:0 0 10px}.usedgroup h4{margin:6px 0 6px;color:#9fd0ff;font:14px Cinzel,Georgia,serif}
.more{background:none;border:none;color:var(--gold);cursor:pointer;font:inherit;padding:0;text-decoration:underline dotted}
.note{font-size:13px;color:var(--muted);line-height:1.4}
@media (max-width:980px){.app{grid-template-columns:1fr}.hero{grid-template-columns:110px 1fr}.hero img{width:110px;height:110px}}
</style></head>

<script>
const DB = JSON.parse(document.getElementById("data").textContent);
const A = "../apps/client/src/renderer/assets";
const tr = (n) => (n && (n.de || n.en)) || "";
const SKILL = (id) => tr(DB.skills[id]) || id;
// Indizes: recipesByResult / recipesByIngredient (aus dem Spieler-Diagramm)
const byResult = {}, byIngredient = {};
for (const a of DB.actions) {
  for (const l of a.loot) (byResult[l.itemId] ||= []).push(a);
  for (const i of a.inputs) (byIngredient[i.itemId] ||= []).push(a);
}
const dropsByItem = {}; for (const d of DB.drops) (dropsByItem[d.itemId] ||= []).push(d);
const RAR = { common: "Gewöhnlich", uncommon: "Ungewöhnlich", rare: "Selten", superRare: "Sehr selten", epic: "Episch", legendary: "Legendär", godly: "Göttlich" };
const TYPE = { material: "Material", equipment: "Ausrüstung", consumable: "Verbrauch", tool: "Werkzeug", key: "Schlüssel", food: "Nahrung" };
const img = (id, cls) => `<img class="${cls}" src="${A}/items/${id}.webp" alt="" onerror="this.style.visibility='hidden'">`;
const il = (id, qty) => { const it = DB.items[id]; return it ? `<a class="il" href="#item/${id}">${img(id, "mini")}${tr(it.name)}${qty ? ` <span class="qty">×${qty}</span>` : ""}</a>` : `<span class="muted">${id}${qty ? " ×" + qty : ""}</span>`; };
const sl = (skillId) => `<a class="sl" href="#skill/${skillId}" title="Skill-Seite (im Spiel: Handwerksbildschirm)">⚒ ${SKILL(skillId)}</a>`;
const pct = (c) => c >= 1 ? "100 %" : c >= 0.01 ? (c * 100).toFixed(0) + " %" : (c * 100).toFixed(2).replace(".", ",") + " %";
const dur = (ms) => ms ? (ms / 1000).toFixed(1).replace(".", ",") + " s" : "";

// Handwerkskette: nach oben das erste Rezept (erste Zutat mit eigenem Rezept), nach unten die Rezepte, die es verwenden
function chainUp(id, depth = 0, seen = new Set()) {
  if (depth > 6 || seen.has(id)) return []; seen.add(id);
  const r = (byResult[id] || []).find((a) => a.inputs.length > 0);
  if (!r) return [];
  const ing = r.inputs.find((i) => (byResult[i.itemId] || []).some((x) => x.inputs.length > 0)) || r.inputs[0];
  if (!ing) return [];
  return [...chainUp(ing.itemId, depth + 1, seen), { id: ing.itemId, via: r }];
}
function primarySource(id) {
  const rs = byResult[id] || [];
  return rs.find((a) => a.inputs.length > 0) || rs[0] || null;
}

function renderItem(id) {
  const it = DB.items[id]; if (!it) return `<h1>Unbekanntes Item</h1><p class="muted">${id}</p>`;
  const sources = byResult[id] || []; const uses = byIngredient[id] || []; const drops = dropsByItem[id] || [];
  const req = it.requirements ? Object.entries(it.requirements).map(([s, l]) => `${SKILL(s)} ${l}`).join(" · ") : "";
  let h = `<div class="hero">${img(id, "")}<div>
    <h1>${tr(it.name)}</h1>
    <div class="sub">${TYPE[it.type] || it.type}${it.slot ? " · " + it.slot : ""}${it.rarity ? " · " + (RAR[it.rarity] || it.rarity) : ""}</div>
    <div class="chips">${it.value != null ? `<span class="chip">Wert <b>${it.value.toLocaleString("de-DE")}</b></span>` : ""}<span class="chip">Stapelbar <b>${it.stackable ? "Ja" : "Nein"}</b></span>${req ? `<span class="chip">Benötigt <b>${req}</b></span>` : ""}<span class="chip muted">${it.id}</span></div>
    ${it.description ? `<p class="desc">${tr(it.description)}</p>` : ""}
  </div></div>`;

  // Erhalten aus
  h += `<section class="sec"><h2>Erhalten aus <span class="count">${sources.length + drops.length}</span></h2>`;
  if (!sources.length && !drops.length) h += `<p class="muted">Keine bekannte Quelle im Ausschnitt.</p>`;
  h += `<div class="src">`;
  for (const a of sources) {
    const out = a.loot.find((l) => l.itemId === id);
    h += `<div class="card"><div class="t"><span>${tr(a.name)}</span><small>${sl(a.skillId)}${a.level ? " · Stufe " + a.level : ""}${a.durationMs ? " · " + dur(a.durationMs) : ""}</small></div>`;
    h += a.inputs.length ? `<div class="ing"><span class="muted">Zutaten:</span> ${a.inputs.map((i) => il(i.itemId, i.qty)).join(" ")}</div>` : `<div class="muted">Sammelaktion${out && out.chance < 1 ? ", Chance " + pct(out.chance) : ""}</div>`;
    h += `<div style="margin-top:8px"><button class="btn sm" onclick="openRecipe('${a.skillId}','${a.id}')">Rezept öffnen</button></div></div>`;
  }
  for (const d of drops.slice(0, 12)) h += `<div class="card"><div class="t"><span>☠ ${tr(d.name)}</span><small>Monster Lv ${d.level} · ${pct(d.chance)}</small></div><div class="muted">Beute beim Sieg</div></div>`;
  if (drops.length > 12) h += `<div class="card muted">… und ${drops.length - 12} weitere Monster</div>`;
  h += `</div></section>`;

  // Verwendet in — nach Skill gruppiert, Ergebnisse als Item-Links
  const groups = {};
  for (const a of uses) for (const l of a.loot) (groups[a.skillId] ||= new Map()).set(l.itemId, a);
  const total = Object.values(groups).reduce((n, m) => n + m.size, 0);
  h += `<section class="sec"><h2>Verwendet in <span class="count">${total} Rezepte</span></h2>`;
  if (!total) h += `<p class="muted">Wird in keinem Rezept verwendet.</p>`;
  for (const [skill, m] of Object.entries(groups)) {
    const entries = [...m.entries()];
    const vis = entries.slice(0, 8), rest = entries.slice(8);
    h += `<div class="usedgroup"><h4>${sl(skill)} <span class="muted">(${entries.length})</span></h4><div class="fan">${vis.map(([rid, a]) => `<span class="chip">${il(rid)} <span class="qty">← ${a.inputs.find((i) => i.itemId === id)?.qty ?? 1}×</span></span>`).join("")}`;
    if (rest.length) h += `<span class="chip" id="more-${skill}"><button class="more" onclick="expandGroup('${skill}')">+${rest.length} weitere</button></span><span id="rest-${skill}" style="display:none">${rest.map(([rid, a]) => `<span class="chip">${il(rid)} <span class="qty">← ${a.inputs.find((i) => i.itemId === id)?.qty ?? 1}×</span></span>`).join("")}</span>`;
    h += `</div></div>`;
  }
  h += `</section>`;

  // Handwerkskette
  const up = chainUp(id); const downs = [...new Set(uses.flatMap((a) => a.loot.map((l) => l.itemId)))].slice(0, 6);
  if (up.length || downs.length) {
    h += `<section class="sec"><h2>Handwerkskette</h2><div class="chain">`;
    for (const step of up) h += `<div class="node">${il(step.id)}</div><div class="arrow">↓ <span class="via">${tr(step.via.name)} · ${SKILL(step.via.skillId)}</span></div>`;
    const my = primarySource(id);
    h += `<div class="node cur">${il(id)}${my && my.inputs.length ? `<span class="via">aus ${my.inputs.map((i) => tr(DB.items[i.itemId]?.name) + " ×" + i.qty).join(", ")}</span>` : ""}</div>`;
    if (downs.length) h += `<div class="arrow">↓ <span class="via">weiter zu</span></div><div class="fan">${downs.map((d) => `<div class="node">${il(d)}</div>`).join("")}</div>`;
    h += `</div></section>`;
  }
  return h;
}
function renderSkill(skillId) {
  const acts = DB.actions.filter((a) => a.skillId === skillId).sort((a, b) => (a.level || 0) - (b.level || 0));
  let h = `<div class="hero"><div></div><div><h1>${SKILL(skillId)}</h1><div class="sub">Skill-Seite · im Spiel öffnet dieser Link den Handwerksbildschirm</div></div></div>`;
  h += `<section class="sec"><h2>Rezepte <span class="count">${acts.length}</span></h2><div class="src">`;
  for (const a of acts.slice(0, 60)) h += `<div class="card"><div class="t"><span>${tr(a.name)}</span><small>${a.level ? "Stufe " + a.level : ""}</small></div><div class="ing">${a.inputs.map((i) => il(i.itemId, i.qty)).join(" ")}${a.inputs.length ? ' <span class="muted">→</span> ' : ""}${a.loot.slice(0, 3).map((l) => il(l.itemId)).join(" ")}</div></div>`;
  if (acts.length > 60) h += `<div class="card muted">… ${acts.length - 60} weitere</div>`;
  return h + `</div></section>`;
}
window.expandGroup = (skill) => { document.getElementById("rest-" + skill).style.display = "contents"; document.getElementById("more-" + skill).style.display = "none"; };
window.openRecipe = (skill, actionId) => toast(`Im Spiel: navigate("/crafting/${skill}/${actionId}") — Handwerksbildschirm mit vorgewähltem Rezept`);
function toast(t) { const e = document.getElementById("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => e.classList.remove("on"), 2600); }

// Routing über den Hash: Browser-Zurück/Vor funktionieren damit von selbst; dazu ein eigener Verlauf
const hist = []; let cursor = -1;
function go(route, fromNav) {
  if (!fromNav) { hist.splice(cursor + 1); hist.push(route); cursor = hist.length - 1; }
  const [kind, id] = route.split("/");
  document.getElementById("page").innerHTML = kind === "skill" ? renderSkill(id) : renderItem(id);
  document.getElementById("page").scrollTop = 0; window.scrollTo(0, 0);
  document.getElementById("back").disabled = cursor <= 0; document.getElementById("fwd").disabled = cursor >= hist.length - 1;
  const ul = document.getElementById("hist"); ul.innerHTML = hist.map((r, i) => { const [k, x] = r.split("/"); const label = k === "skill" ? "⚒ " + SKILL(x) : tr(DB.items[x]?.name) || x; return `<li class="${i === cursor ? "cur" : ""}" onclick="jump(${i})">${k === "item" ? img(x, "mini") : ""}${label}</li>`; }).join("");
  document.title = "Wiki · " + (kind === "skill" ? SKILL(id) : tr(DB.items[id]?.name) || id);
}
window.jump = (i) => { cursor = i; location.hash = "#" + hist[i]; go(hist[i], true); };
document.getElementById("back").onclick = () => { if (cursor > 0) { cursor--; location.hash = "#" + hist[cursor]; go(hist[cursor], true); } };
document.getElementById("fwd").onclick = () => { if (cursor < hist.length - 1) { cursor++; location.hash = "#" + hist[cursor]; go(hist[cursor], true); } };
window.addEventListener("hashchange", () => { const r = location.hash.slice(1); if (r && r !== hist[cursor]) go(r, false); });
document.addEventListener("keydown", (e) => { if (e.altKey && e.key === "ArrowLeft") document.getElementById("back").click(); if (e.altKey && e.key === "ArrowRight") document.getElementById("fwd").click(); });
// Suche
const q = document.getElementById("q"), res = document.getElementById("res");
q.addEventListener("input", () => { const s = q.value.trim().toLowerCase(); res.innerHTML = ""; if (s.length < 2) return; const hits = Object.values(DB.items).filter((it) => it.id.includes(s) || tr(it.name).toLowerCase().includes(s)).slice(0, 30); res.innerHTML = hits.map((it) => `<li onclick="location.hash='#item/${it.id}'">${img(it.id, "mini")}${tr(it.name)} <span class="muted">${it.id}</span></li>`).join(""); });
// Start
const start = location.hash.slice(1) || "item/iron_bar"; location.hash = "#" + start; go(start, false);
</script>
